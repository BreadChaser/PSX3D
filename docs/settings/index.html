<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:var(--font-sans,system-ui);color:var(--foreground,#dce3f5);margin:0}nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}button{font:inherit;font-size:12px;border:1px solid var(--border,#394261);color:inherit;background:var(--secondary,#151b2a);border-radius:6px;padding:6px 9px;cursor:pointer}button.active{background:var(--primary,#3768d7);color:var(--primary-foreground,#fff)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;background:var(--card,#111726);padding:16px;border-radius:var(--radius,10px);min-width:0}figcaption{font-size:13px;margin-bottom:10px}img{display:block;width:100%;height:auto;image-rendering:auto}img[hidden]{display:none}@media(max-width:500px){.grid{grid-template-columns:1fr}}p{font-size:12px;color:var(--muted-foreground,#9aabc7);margin:12px 0 0}</style></head><body><nav><button data-page="Settings" class="">Settings</button><button data-page="Display" class="active">Display</button><button data-page="Performance" class="">Performance</button><button data-page="Controls" class="">Controls</button><button data-page="Sound" class="">Sound</button><button data-page="General" class="">General</button><button data-page="Advanced" class="">Advanced</button><button data-page="Core" class="">Core options</button><button data-page="Software" class="">Old Software</button></nav><div class="grid"><figure><figcaption>Old 3DS · Library defaults</figcaption><img data-page="Settings" src="old-global-Settings.png" alt="old global Settings" hidden><img data-page="Display" src="old-global-Display.png" alt="old global Display"><img data-page="Performance" src="old-global-Performance.png" alt="old global Performance" hidden><img data-page="Controls" src="old-global-Controls.png" alt="old global Controls" hidden><img data-page="Sound" src="old-global-Sound.png" alt="old global Sound" hidden><img data-page="General" src="old-global-General.png" alt="ol
