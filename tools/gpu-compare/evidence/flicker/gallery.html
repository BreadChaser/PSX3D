<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground,#ddd)}select{font:inherit;background:var(--card,#222);color:inherit;border:1px solid var(--border,#555);border-radius:6px;padding:7px 10px;max-width:100%}p{margin:10px 0;color:var(--muted-foreground,#aaa)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.picture{position:relative;overflow:hidden;aspect-ratio:512/240;background:#000}.picture img{position:absolute;width:300%;max-width:none;top:-8.333%;height:108.333%}.label{font-size:12px;margin-bottom:6px}.note{font-size:12px;line-height:1.5}strong{color:var(--foreground,#ddd)}@media(max-width:480px){.grid{grid-template-columns:1fr;gap:14px}}</style></head><body><select id="case" aria-label="Replay scene"></select><p id="caption"></p><div class="grid"><div><div class="label">P.E.Op.S. reference</div><div class="picture"><img id="pic0" style="left:0%" alt="P.E.Op.S. reference"></div></div><div><div class="label">9b4dc04 baseline</div><div class="picture"><img id="pic1" style="left:-100%" alt="9b4dc04 baseline"></div></div><div><div class="label">Fixed PICA</div><div class="picture"><img id="pic2" style="left:-200%" alt="Fixed PICA"></div></div></div><p class="note">Host replays of identical GPU commands. Four other games retain byte-identical images and draw hashes. <strong>Console validation remains pending.</strong> Shared left-edge popping with widescreen enabled has separate game-culling evidence.</p><script>const cases=[{"src": "o3auto-0059.png", "label": "Crash beach \u00b7 frame 59", "description": "Missing right-edge terrain restored"}, {"src": "level-entry-0330.png", "label": "Level entry \u00b7 frame 330", "description": "Missing screen-wide fade restored"}, {"src": "boot-1440.png", "label": "Cold boot \u00b7 frame 1440", "description": "Title fade restored without a saved state"}];const sel=document.getElementById('case');cases.forEach((c,i)=>sel.add(new Option(c.label,i)));function show(){const c=cases[+sel.value];document.getElementById('caption').textContent=c.description;for(let i=0;i<3;i++)document.getElementById('pic'+i).src=c.src;}sel.onchange=show;show();console.log('Gallery ready:',cases.length,'scenes');</script></body></html>
