; PSX3D defaults, per console (docs/settings.md section 6). Values use the
; preset vocabulary: on/off for the core's enabled/disabled, otherwise the
; core's or the menu's own value word. [old]/[new] are the settings' starting
; values; [forced.*] are fixed in code and have no menu row.
; Released versions are archived unchanged in tools/presets/defaults-history.
defaults_version = 2

[old]
screen = original
smooth = on
show_fps = off
theme = synthwave
controller = digital
analog_combo = l1+r1+select
analog_axis_modifier = square
touch_click_left = right
memcard1 = libretro
memcard2 = shared
rewind = off
frameskip = auto
psxclock = auto
alt_flip = auto
gpu_slow_llists = auto
cd_turbo = off
nostalls = off
nolddelay = off
gteregsunneeded = on
nogteflags = on
nosmccheck = off
icache_emulation = on
exception_emulation = off
nocompathacks = off

[new]
screen = original
smooth = on
show_fps = off
theme = synthwave
controller = digital
analog_combo = l1+r1+select
analog_axis_modifier = square
touch_click_left = right
memcard1 = libretro
memcard2 = shared
rewind = on
frameskip = auto
psxclock = auto
alt_flip = auto
gpu_slow_llists = auto
cd_turbo = off
nostalls = off
nolddelay = off
gteregsunneeded = off
nogteflags = off
nosmccheck = off
icache_emulation = on
exception_emulation = off
nocompathacks = off

[forced.old]
sounds = on
music = on
stereo = off
region = auto
bios = auto
show_bios_bootlogo = off
cd_readahead = 256
drc = on
drc_thread = off
dithering = on
gpu_thread_rendering = off
frameskip_interval = 2
frameskip_threshold = 33
display_fps_v2 = off
fractional_framerate = auto
rgb32_output = off
scale_hires = on
show_overscan = off
screen_centering = auto
show_input_settings = off
spu_reverb = on
spu_interpolation = simple
nocdaudio = on
noxadecoding = on
spu_thread = on
vibration = on
multitap = off
3ds_appcputime = 30
audio_stretch = on
fast_forward = on
auto_floor = 15

[forced.new]
sounds = on
music = on
stereo = real
region = auto
bios = auto
show_bios_bootlogo = off
cd_readahead = 256
drc = on
drc_thread = off
dithering = on
gpu_thread_rendering = on
frameskip_interval = 2
frameskip_threshold = 33
display_fps_v2 = off
fractional_framerate = auto
rgb32_output = off
scale_hires = on
show_overscan = off
screen_centering = auto
show_input_settings = off
spu_reverb = on
spu_interpolation = gaussian
nocdaudio = on
noxadecoding = on
spu_thread = off
vibration = on
multitap = off
3ds_appcputime = 35
audio_stretch = on
fast_forward = on
auto_floor = 15
